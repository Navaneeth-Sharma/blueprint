schema_version: "1.1"
name: explore-micro
tags: [explore]
runs: 1
context:
  scaffold_script: setup.sh
execution:
  max_turns: 120
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  prompt: |
    /blueprint:blueprint explore add a --json flag to "todo list" so shell scripts can read the list reliably
