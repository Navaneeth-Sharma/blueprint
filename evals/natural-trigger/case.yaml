schema_version: "1.1"
name: natural-trigger
tags: [explore]
runs: 1
context:
  scaffold_script: setup.sh
execution:
  max_turns: 120
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  prompt: |
    Before we change any code: I want to add due dates to todo items. Research how it works today and give me a reviewable HTML sheet with the micro features, diagrams, edge cases and the questions I need to answer. Don't write the ADR yet.
